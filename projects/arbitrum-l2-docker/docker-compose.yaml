services:

  # ---------------------------------------------------------------
  # rollupcreator — Arbitrum rollup/system contract deployer
  # Usage: docker compose run --rm rollupcreator create-rollup-testnode
  # All required env vars are passed explicitly by 03-deploy-rollup.sh.
  # ---------------------------------------------------------------
  rollupcreator:
    build:
      context: ./rollupcreator
      args:
        NITRO_CONTRACTS_BRANCH: ${NITRO_CONTRACTS_BRANCH:-v3.1.0}
    volumes:
      - ./config:/config

  # ---------------------------------------------------------------
  # sequencer — Single Nitro node, simple mode
  # Roles: sequencer + delayed-sequencer + batch-poster + staker
  # No redis, no validation_node, no separate poster/staker service.
  # Config is generated by 04-render-node-configs.sh.
  # ---------------------------------------------------------------
  sequencer:
    image: ${NITRO_NODE_IMAGE:-offchainlabs/nitro-node:v3.9.6-91bf578}
    entrypoint: /usr/local/bin/nitro
    command:
      - --conf.file=/config/sequencer_config.json
      - --node.feed.output.enable
      - --node.feed.output.port=9642
      - --http.api=net,web3,eth,txpool,debug
    ports:
      - "${L2_RPC_PORT:-8547}:8547"
      - "${L2_WS_PORT:-8548}:8548"
      - "${L2_FEED_PORT:-9642}:9642"
    volumes:
      - ./config:/config:ro
      - seqdata:/home/user/.arbitrum/local/nitro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  seqdata:
